<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>스텔라이브 리듬게임 - StellMax</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    body { background: #0b0b12; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; user-select: none; }

    #bg-container {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
      z-index: 1; pointer-events: none;
    }

    /* 화면에 전혀 보이지 않게 숨긴 오디오 플레이어 */
    #audio-stream { display: none; }

    .screen-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(11, 11, 18, 0.95); z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px;
    }

    .card {
      background: #1e293b; border: 1px solid #334155; border-radius: 16px;
      padding: 28px 24px; width: 100%; max-width: 360px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center;
    }

    .card h1 { color: #38bdf8; font-size: 26px; margin-bottom: 8px; }
    .card p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }

    .form-group { text-align: left; margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; font-weight: bold; }
    
    input[type="text"], select {
      width: 100%; padding: 12px 14px; font-size: 15px; background: #0f172a; color: #ffffff;
      border: 1px solid #475569; border-radius: 8px; outline: none;
    }
    input[type="text"]:focus, select:focus { border-color: #38bdf8; }

    .btn-primary {
      width: 100%; padding: 14px; font-size: 16px; font-weight: bold; color: #fff;
      background: linear-gradient(135deg, #0284c7, #38bdf8); border: none; border-radius: 8px;
      cursor: pointer; margin-top: 10px; transition: transform 0.1s, opacity 0.2s;
    }
    .btn-primary:active { transform: scale(0.98); }

    #game-container {
      position: relative; width: 100%; max-width: 480px; height: 100vh;
      margin: 0 auto; background: rgba(12, 12, 24, 0.75);
      border-left: 2px solid #334155; border-right: 2px solid #334155; z-index: 2;
      display: none;
    }

    .lane {
      position: absolute; top: 0; bottom: 0; width: 25%;
      border-right: 1px dashed rgba(255,255,255,0.1);
    }

    .note {
      position: absolute; width: 23%; height: 22px;
      background: linear-gradient(180deg, #38bdf8, #0284c7);
      border-radius: 4px; box-shadow: 0 0 12px #38bdf8;
    }

    #judge-line {
      position: absolute; bottom: 120px; width: 100%; height: 6px;
      background: #f43f5e; box-shadow: 0 0 15px #f43f5e;
    }

    #touch-controls {
      position: absolute; bottom: 0; width: 100%; height: 120px; display: flex; z-index: 5;
    }
    .touch-btn {
      flex: 1; border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05); display: flex;
      align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #94a3b8;
    }
    .touch-btn:active { background: rgba(56, 189, 248, 0.35); color: #fff; }

    #in-game-ui {
      position: absolute; top: 15px; left: 15px; z-index: 10; display: flex; flex-direction: column; gap: 6px;
    }
    #user-tag { font-size: 14px; color: #94a3b8; }
    #score-board { font-size: 22px; font-weight: bold; color: #38bdf8; }
    #diff-tag { font-size: 12px; color: #f43f5e; font-weight: bold; }
  </style>
</head>
<body>

  <div id="bg-container"></div>
  <!-- 유튜브 스트림을 오디오로 직접 추출하여 재생하는 태그 -->
  <audio id="audio-stream" preload="auto"></audio>

  <!-- 1. 로그인 화면 -->
  <div id="login-screen" class="screen-overlay">
    <div class="card">
      <h1>⭐ StellMax</h1>
      <p>스텔라이브 리듬게임에 오신 것을 환영합니다!</p>
      <div class="form-group">
        <label for="username-input">플레이어 닉네임</label>
        <input type="text" id="username-input" placeholder="닉네임을 입력하세요" value="스텔라">
      </div>
      <button class="btn-primary" onclick="handleLogin()">접속하기</button>
    </div>
  </div>

  <!-- 2. 곡 & 난이도 선택 화면 -->
  <div id="select-screen" class="screen-overlay" style="display: none;">
    <div class="card">
      <h1>🎵 곡 & 난이도 선택</h1>
      <p id="welcome-msg">환영합니다!</p>
      
      <div class="form-group">
        <label for="song-select">노래 선택</label>
        <select id="song-select"></select>
      </div>

      <div class="form-group">
        <label for="difficulty-select">난이도 설정</label>
        <select id="difficulty-select">
          <option value="EASY">EASY (속도 느림)</option>
          <option value="NORMAL" selected>NORMAL (보통)</option>
          <option value="HARD">HARD (속도 빠름)</option>
        </select>
      </div>

      <button id="start-btn" class="btn-primary" onclick="startGame()">🎮 게임 시작</button>
    </div>
  </div>

  <!-- 3. 리듬게임 메인 화면 -->
  <div id="game-container">
    <div id="in-game-ui">
      <div id="user-tag">PLAYER: <span id="player-name">스텔라</span></div>
      <div id="diff-tag">DIFFICULTY: <span id="diff-display">NORMAL</span></div>
      <div id="score-board">SCORE: <span id="score">0</span></div>
    </div>

    <div class="lane" style="left: 0%;"></div>
    <div class="lane" style="left: 25%;"></div>
    <div class="lane" style="left: 50%;"></div>
    <div class="lane" style="left: 75%;"></div>
    <div id="judge-line"></div>

    <div id="touch-controls">
      <div class="touch-btn" id="btn-0">D</div>
      <div class="touch-btn" id="btn-1">F</div>
      <div class="touch-btn" id="btn-2">J</div>
      <div class="touch-btn" id="btn-3">K</div>
    </div>
  </div>

  <script>
    // 🎵 곡 목록 (유튜브 ID만 넣어주면 됩니다)
    const songDatabase = [
      {
        title: "[아라하시 타비] - 물떼새 (千鳥)",
        ytId: "uBtFoUXR9Qc",
        notes: [
          { lane: 0, time: 18.0 },
          { lane: 1, time: 19.5 },
          { lane: 2, time: 21.0 },
          { lane: 3, time: 22.5 },
          { lane: 0, time: 23.5 },
          { lane: 1, time: 25.0 },
          { lane: 2, time: 26.0 },
          { lane: 3, time: 27.5 },
          { lane: 0, time: 34.0 },
          { lane: 2, time: 35.5 },
          { lane: 1, time: 37.0 },
          { lane: 3, time: 38.5 },
          { lane: 0, time: 40.0 }
        ]
      }
    ];

    let username = "스텔라";
    let selectedDifficulty = "NORMAL";
    let noteSpeedFactor = 350;
    let activeNotes = [], score = 0, isPlaying = false;
    
    const audioElement = document.getElementById('audio-stream');
    const laneKeys = ['D', 'F', 'J', 'K'];
    const laneXPercent = [1, 26, 51, 76];

    function handleLogin() {
      const input = document.getElementById('username-input').value.trim();
      if (input) username = input;
      
      document.getElementById('welcome-msg').innerText = `${username}님, 원하는 곡과 난이도를 선택해 주세요!`;
      document.getElementById('player-name').innerText = username;
      
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('select-screen').style.display = 'flex';
      
      initSongSelect();
    }

    function initSongSelect() {
      const select = document.getElementById('song-select');
      select.innerHTML = "";
      songDatabase.forEach((song, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = song.title;
        select.appendChild(opt);
      });
    }

    function startGame() {
      const selectElement = document.getElementById('song-select');
      const selectedIndex = selectElement.value || 0;
      const song = songDatabase[selectedIndex];
      
      selectedDifficulty = document.getElementById('difficulty-select').value;
      document.getElementById('diff-display').innerText = selectedDifficulty;

      if (selectedDifficulty === "EASY") noteSpeedFactor = 250;
      else if (selectedDifficulty === "NORMAL") noteSpeedFactor = 350;
      else if (selectedDifficulty === "HARD") noteSpeedFactor = 500;

      document.getElementById('select-screen').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';

      // 광고를 피하기 위해 우회 오디오 라이브러리 스트림 주소 연결
      audioElement.src = `https://pipe-api.kavin.rocks/stream/${song.ytId}`;
      audioElement.currentTime = 0;

      audioElement.play().then(() => {
        score = 0;
        document.getElementById('score').innerText = score;
        activeNotes = JSON.parse(JSON.stringify(song.notes));
        isPlaying = true;
        requestAnimationFrame(updateGame);
      }).catch(() => {
        score = 0;
        document.getElementById('score').innerText = score;
        activeNotes = JSON.parse(JSON.stringify(song.notes));
        isPlaying = true;
        requestAnimationFrame(updateGame);
      });
    }

    function updateGame() {
      if (!isPlaying) return;

      const currentTime = audioElement.currentTime || 0;
      const gameContainer = document.getElementById('game-container');
      document.querySelectorAll('.note').forEach(n => n.remove());

      activeNotes.forEach((note) => {
        const timeDiff = note.time - currentTime;
        if (timeDiff <= 2.0 && timeDiff >= -0.2) {
          const noteElement = document.createElement('div');
          noteElement.className = 'note';
          noteElement.style.left = laneXPercent[note.lane] + '%';
          
          const targetY = window.innerHeight - 120; 
          const currentY = targetY - (timeDiff * noteSpeedFactor); 
          
          noteElement.style.top = currentY + 'px';
          gameContainer.appendChild(noteElement);
        }
      });

      if (audioElement.ended) {
        isPlaying = false;
        alert(`플레이 완료! 총점: ${score}점`);
        location.reload();
      } else {
        requestAnimationFrame(updateGame);
      }
    }

    function checkHit(laneIndex) {
      if (!isPlaying) return;
      const currentTime = audioElement.currentTime || 0;
      const hitIndex = activeNotes.findIndex(n => n.lane === laneIndex && Math.abs(n.time - currentTime) < 0.25);

      if (hitIndex !== -1) {
        score += 100;
        document.getElementById('score').innerText = score;
        activeNotes.splice(hitIndex, 1);
      }
    }

    window.addEventListener('keydown', (e) => {
      const laneIndex = laneKeys.indexOf(e.key.toUpperCase());
      if (laneIndex !== -1) checkHit(laneIndex);
    });

    for (let i = 0; i < 4; i++) {
      const btn = document.getElementById(`btn-${i}`);
      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        checkHit(i);
      });
    }
  </script>
</body>
</html>
