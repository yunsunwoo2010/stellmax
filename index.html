<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>스텔라이브 리듬게임 - StellMax</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    body { background: #0b0b12; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; user-select: none; }

    #bg-container {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
      z-index: 1; pointer-events: none;
    }

    .screen-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; min-height: 100vh;
      background: rgba(11, 11, 18, 0.95); z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      padding: 30px 20px; overflow-y: auto;
    }

    .card {
      background: #1e293b; border: 1px solid #334155; border-radius: 16px;
      padding: 24px; width: 100%; max-width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; margin-bottom: 20px;
    }

    .card h1 { color: #38bdf8; font-size: 26px; margin-bottom: 8px; }
    .card p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }

    .form-group { text-align: left; margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; font-weight: bold; }
    
    input[type="text"], select {
      width: 100%; padding: 12px 14px; font-size: 15px; background: #0f172a; color: #ffffff;
      border: 1px solid #475569; border-radius: 8px; outline: none;
    }

    .btn-primary {
      width: 100%; padding: 14px; font-size: 16px; font-weight: bold; color: #fff;
      background: linear-gradient(135deg, #0284c7, #38bdf8); border: none; border-radius: 8px;
      cursor: pointer; transition: transform 0.1s;
    }
    .btn-primary:active { transform: scale(0.98); }

    /* 음악 사이트 스타일 카드 목록 */
    .song-list { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
    .song-card {
      background: #0f172a; border: 2px solid #334155; border-radius: 12px;
      padding: 16px; display: flex; align-items: center; gap: 14px; cursor: pointer;
      transition: all 0.2s;
    }
    .song-card.selected { border-color: #38bdf8; background: #1e293b; box-shadow: 0 0 12px rgba(56,189,248,0.3); }
    .song-cover {
      width: 56px; height: 56px; border-radius: 8px; background: #334155;
      display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0;
    }
    .song-info { text-align: left; flex: 1; }
    .song-title { font-size: 16px; font-weight: bold; color: #f8fafc; margin-bottom: 4px; }
    .song-artist { font-size: 13px; color: #94a3b8; }
    .song-highscore { font-size: 12px; color: #38bdf8; margin-top: 4px; font-weight: bold; }

    /* 리듬게임 메인 레인 */
    #game-container {
      position: relative; width: 100%; max-width: 480px; height: 100vh;
      margin: 0 auto; background: rgba(12, 12, 24, 0.9);
      border-left: 2px solid #334155; border-right: 2px solid #334155; z-index: 2;
      display: none;
    }

    .lane {
      position: absolute; top: 0; bottom: 0; width: 25%;
      border-right: 1px dashed rgba(255,255,255,0.1);
    }

    .note {
      position: absolute; width: 23%; height: 22px;
      background: linear-gradient(180deg, #38bdf8, #0284c7);
      border-radius: 4px; box-shadow: 0 0 12px #38bdf8;
    }

    #judge-line {
      position: absolute; bottom: 120px; width: 100%; height: 6px;
      background: #f43f5e; box-shadow: 0 0 15px #f43f5e;
    }

    #touch-controls {
      position: absolute; bottom: 0; width: 100%; height: 120px; display: flex; z-index: 5;
    }
    .touch-btn {
      flex: 1; border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05); display: flex;
      align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #94a3b8;
    }
    .touch-btn:active { background: rgba(56, 189, 248, 0.35); color: #fff; }

    #in-game-ui {
      position: absolute; top: 15px; left: 15px; z-index: 10; display: flex; flex-direction: column; gap: 4px;
    }
    #user-tag { font-size: 14px; color: #94a3b8; }
    #score-board { font-size: 22px; font-weight: bold; color: #38bdf8; }
    #diff-tag { font-size: 12px; color: #f43f5e; font-weight: bold; }
  </style>
</head>
<body>

  <div id="bg-container"></div>
  <audio id="game-audio" preload="auto"></audio>

  <!-- 1. 로그인 화면 -->
  <div id="login-screen" class="screen-overlay">
    <div class="card">
      <h1>⭐ StellMax</h1>
      <p>기록 저장을 위해 닉네임을 입력하세요.</p>
      <div class="form-group">
        <label for="username-input">플레이어 닉네임</label>
        <input type="text" id="username-input" placeholder="닉네임 입력">
      </div>
      <button class="btn-primary" onclick="handleLogin()">접속 및 기록 시작</button>
    </div>
  </div>

  <!-- 2. 곡 선택 화면 (음악 사이트 카드 레이아웃) -->
  <div id="select-screen" class="screen-overlay" style="display: none;">
    <div class="card">
      <h1>🎵 곡 목록</h1>
      <p id="welcome-msg">플레이할 곡을 선택하세요.</p>
      
      <div class="form-group">
        <label>난이도 선택</label>
        <select id="difficulty-select" onchange="renderSongList()">
          <option value="EASY">EASY (느림)</option>
