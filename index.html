<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>스텔라이브 리듬게임 - StellMax</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    body { background: #0b0b12; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; user-select: none; }

    /* 유튜브 배경 영상 */
    #video-container {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; opacity: 0.35; z-index: 1; overflow: hidden;
    }
    #player { width: 100vw; height: 100vh; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(1.2); }

    /* 모달 / 메인 스크린 공통 */
    .screen-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(11, 11, 18, 0.9); z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px;
    }

    .card {
      background: #1e293b; border: 1px solid #334155; border-radius: 16px;
      padding: 28px 24px; width: 100%; max-width: 360px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center;
    }

    .card h1 { color: #38bdf8; font-size: 26px; margin-bottom: 8px; }
    .card p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }

    .form-group { text-align: left; margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; font-weight: bold; }
    
    input[type="text"], select {
      width: 100%; padding: 12px 14px; font-size: 15px; background: #0f172a; color: #ffffff;
      border: 1px solid #475569; border-radius: 8px; outline: none;
    }
    input[type="text"]:focus, select:focus { border-color: #38bdf8; }

    .btn-primary {
      width: 100%; padding: 14px; font-size: 16px; font-weight: bold; color: #fff;
      background: linear-gradient(135deg, #0284c7, #38bdf8); border: none; border-radius: 8px;
      cursor: pointer; margin-top: 10px; transition: transform 0.1s, opacity 0.2s;
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { background: #475569; opacity: 0.6; cursor: not-allowed; }

    /* 게임 화면 요소를 담는 컨테이너 */
    #game-container {
      position: relative; width: 100%; max-width: 480px; height: 100vh;
      margin: 0 auto; background: rgba(12, 12, 24, 0.75);
      border-left: 2px solid #334155; border-right: 2px solid #334155; z-index: 2;
      display: none; /* 로그인 및 난이도 선택 후 표시 */
    }

    .lane {
      position: absolute; top: 0; bottom: 0; width: 25%;
      border-right: 1px dashed rgba(255,255,255,0.1);
    }

    .note {
      position: absolute; width: 23%; height: 22px;
      background: linear-gradient(180deg, #38bdf8, #0284c7);
      border-radius: 4px; box-shadow: 0 0 12px #38bdf8;
    }

    #judge-line {
      position: absolute; bottom: 120px; width: 100%; height: 6px;
      background: #f43f5e; box-shadow: 0 0 15px #f43f5e;
    }

    #touch-controls {
      position: absolute; bottom: 0; width: 100%; height: 120px; display: flex; z-index: 5;
    }
    .touch-btn {
      flex: 1; border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05); display: flex;
      align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #94a3b8;
    }
    .touch-btn:active { background: rgba(56, 189, 248, 0.35); color: #fff; }

    #in-game-ui {
      position: absolute; top: 15px; left: 15px; z-index: 10; display: flex; flex-direction: column; gap: 6px;
    }
    #user-tag { font-size: 14px; color: #94a3b8; }
    #score-board { font-size: 22px; font-weight: bold; color: #38bdf8; }
    #diff-tag { font-size: 12px; color: #f43f5e; font-weight: bold; }
  </style>
</head>
<body>

  <!-- 유튜브 배경 재생기 -->
  <div id="video-container">
    <div id="player"></div>
  </div>

  <!-- 1. 로그인 화면 -->
  <div id="login-screen" class="screen-overlay">
    <div class="card">
      <h1>⭐ StellMax</h1>
      <p>스텔라이브 리듬게임에 오신 것을 환영합니다!</p>
      <div class="form-group">
        <label for="username-input">플레이어 닉네임</label>
        <input type="text" id="username-input" placeholder="닉네임을 입력하세요" value="스텔라">
      </div>
      <button class="btn-primary" onclick="handleLogin()">접속하기</button>
    </div>
  </div>

  <!-- 2. 곡 및 난이도 선택 화면 -->
  <div id="select-screen" class="screen-overlay" style="display: none;">
    <div class="card">
      <h1>🎵 곡 & 난이도 선택</h1>
      <p id="welcome-msg">환영합니다!</p>
      
      <div class="form-group">
        <label for="song-select">노래 선택</label>
        <select id="song-select"></select>
      </div>

      <div class="form-group">
        <label for="difficulty-select">난이도 설정</label>
        <select id="difficulty-select">
          <option value="EASY">EASY (속도 느림)</option>
          <option value="NORMAL" selected>NORMAL (보통)</option>
          <option value="HARD">HARD (속도 빠름)</option>
        </select>
      </div>

      <button id="start-btn" class="btn-primary" onclick="startGame()">🎮 게임 시작</button>
    </div>
  </div>

  <!-- 3. 리듬게임 메인 화면 -->
  <div id="game-container">
    <div id="in-game-ui">
      <div id="user-tag">PLAYER
