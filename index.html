<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>스텔라이브 리듬게임</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    body { background: #0b0b12; color: #fff; font-family: sans-serif; overflow: hidden; user-select: none; }

    #video-container {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; opacity: 0.4; z-index: 1; overflow: hidden;
    }
    #player { width: 100vw; height: 100vh; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(1.2); }

    #game-container {
      position: relative; width: 100%; max-width: 480px; height: 100vh;
      margin: 0 auto; background: rgba(12, 12, 24, 0.75);
      border-left: 2px solid #334155; border-right: 2px solid #334155; z-index: 2;
    }

    .lane {
      position: absolute; top: 0; bottom: 0; width: 25%;
      border-right: 1px dashed rgba(255,255,255,0.1);
    }

    .note {
      position: absolute; width: 23%; height: 22px;
      background: linear-gradient(180deg, #38bdf8, #0284c7);
      border-radius: 4px; box-shadow: 0 0 12px #38bdf8;
    }

    #judge-line {
      position: absolute; bottom: 120px; width: 100%; height: 6px;
      background: #f43f5e; box-shadow: 0 0 15px #f43f5e;
    }

    #touch-controls {
      position: absolute; bottom: 0; width: 100%; height: 120px; display: flex; z-index: 5;
    }
    .touch-btn {
      flex: 1; border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05); display: flex;
      align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #94a3b8;
    }
    .touch-btn:active { background: rgba(56, 189, 248, 0.35); color: #fff; }

    #ui-overlay {
      position: absolute; top: 15px; left: 15px; z-index: 10; display: flex; flex-direction: column; gap: 8px; width: 260px;
    }
    
    select {
      width: 100%; padding: 12px 14px; font-size: 15px; background: #1e293b; color: #ffffff;
      border: 1px solid #475569; border-radius: 8px; cursor: pointer;
    }
    select option { background: #1e293b; color: #ffffff; }

    button {
      padding: 12px 14px; font-size: 15px; background: #1e293b; color: #fff;
      border: 1px solid #475569; border-radius: 8px; cursor: pointer; font-weight: bold;
    }
    button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    #score-board { font-size: 20px; font-weight: bold; margin-top: 5px; color: #38bdf8; }
  </style>
</head>
<body>

  <div id="ui-overlay">
    <select id="song-select"></select>
    <button id="start-btn" onclick="startGame()">⏳ 준비 중...</button>
    <div id="score-board">SCORE: <span id="score">0</span></div>
  </div>

  <div id="video-container">
    <div id="player"></div>
  </div>

  <div id="game-container">
    <div class="lane" style="left: 0%;"></div>
    <div class="lane" style="left: 25%;"></div>
    <div class="lane" style="left: 50%;"></div>
    <div class="lane" style="left: 75%;"></div>
    <div id="judge-line"></div>

    <div id="touch-controls">
      <div class="touch-btn" id="btn-0">D</div>
      <div class="touch-btn" id="btn-1">F</div>
      <div class="touch-btn" id="btn-2">J</div>
      <div class="touch-btn" id="btn-3">K</div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const songDatabase = [
      {
        title: "[아라하시 타비] - 물떼새",
        videoId: "uBtFoUXR9Qc",
        notes: [
          { lane: 0, time: 18.0 },
          { lane: 1, time: 19.5 },
          { lane: 2, time: 21.0 },
          { lane: 3, time: 22.5 },
          { lane: 0, time: 23.5 },
          { lane: 1, time: 25.0 },
          { lane: 2, time: 26.0 },
          { lane: 3, time: 27.5 },
          { lane: 0, time: 34.0 },
          { lane: 2, time: 35.5 },
          { lane: 1, time: 37.0 },
          { lane: 3, time: 38.5 },
          { lane: 0, time: 40.0 }
        ]
      }
    ];

    let player = null, activeNotes = [], score = 0, isPlaying = false;
    const laneKeys = ['D', 'F', 'J', 'K'];
    const laneXPercent = [1, 26, 51, 76];

    function initSongSelect() {
      const select = document.getElementById('song-select');
      if (!select) return;
      select.innerHTML = "";
      songDatabase.forEach((song, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = song.title;
        select.appendChild(opt);
      });
    }
    initSongSelect();

    function onYouTubeIframeAPIReady() {
      try {
        player = new YT.Player('player', {
          videoId: songDatabase[0].videoId,
          playerVars: {
            'autoplay': 0,
            'controls': 0,
            'disablekb': 1,
            'fs': 0,
            'iv_load_policy': 3,
            'modestbranding': 1,
            'playsinline': 1,
            'rel': 0
          },
          events: {
            'onReady': () => {
              const startBtn = document.getElementById('start-btn');
              startBtn.innerText = "🎮 게임 시작";
              startBtn.disabled = false;
            }
          }
        });
      } catch (e) {
        console.error(e);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const startBtn = document.getElementById('start-btn');
        if (startBtn.disabled) {
          startBtn.innerText = "🎮 게임 시작";
          startBtn.disabled = false;
        }
      }, 2000);
    });

    function startGame() {
      const selectElement = document.getElementById('song-select');
      const selectedIndex = selectElement.value || 0;
      const song = songDatabase[selectedIndex];
      
      if (player && player.loadVideoById) {
        try {
          player.loadVideoById({ 'videoId': song.videoId, 'startSeconds': 0 });
          player.playVideo();
        } catch (e) {
          console.error(e);
        }
      }

      score = 0;
      document.getElementById('score').innerText = score;
      activeNotes = JSON.parse(JSON.stringify(song.notes));
      isPlaying = true;

      requestAnimationFrame(updateGame);
    }

    function updateGame() {
      if (!isPlaying) return;

      let currentTime = 0;
      try {
        if (player && player.getCurrentTime) {
          currentTime = player.getCurrentTime() || 0;
        }
      } catch (e) {
        currentTime = 0;
      }

      const gameContainer = document.getElementById('game-container');
      document.querySelectorAll('.note').forEach(n => n.remove());

      activeNotes.forEach((note) => {
        const timeDiff = note.time - currentTime;
        if (timeDiff <= 2.0 && timeDiff >= -0.2) {
          const noteElement = document.createElement('div');
          noteElement.className = 'note';
          noteElement.style.left = laneXPercent[note.lane] + '%';
          
          const targetY = window.innerHeight - 120; 
          const currentY = targetY - (timeDiff * 350); 
          
          noteElement.style.top = currentY + 'px';
          gameContainer.appendChild(noteElement);
        }
      });

      requestAnimationFrame(updateGame);
    }

    function checkHit(laneIndex) {
      if (!isPlaying) return;
      let currentTime = 0;
      try {
        if (player && player.getCurrentTime) {
          currentTime = player.getCurrentTime() || 0;
        }
      } catch (e) {
        currentTime = 0;
      }

      const hitIndex = activeNotes.findIndex(n => n.lane === laneIndex && Math.abs(n.time - currentTime) < 0.25);

      if (hitIndex !== -1) {
        score += 100;
        document.getElementById('score').innerText = score;
        activeNotes.splice(hitIndex, 1);
      }
    }

    window.addEventListener('keydown', (e) => {
      const laneIndex = laneKeys.indexOf(e.key.toUpperCase());
      if (laneIndex !== -1) checkHit(laneIndex);
    });

    for (let i = 0; i < 4; i++) {
      const btn = document.getElementById(`btn-${i}`);
      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        checkHit(i);
      });
    }
  </script>
</body>
</html>
