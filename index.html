<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>스텔라이브 리듬게임 - StellMax</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    body { background: #0b0b12; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; user-select: none; }

    #bg-container {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
      z-index: 1; pointer-events: none;
    }

    .screen-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; min-height: 100vh;
      background: rgba(11, 11, 18, 0.95); z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      padding: 30px 20px; overflow-y: auto;
    }

    .card {
      background: #1e293b; border: 1px solid #334155; border-radius: 16px;
      padding: 24px; width: 100%; max-width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; margin-bottom: 20px;
    }

    .card h1 { color: #38bdf8; font-size: 26px; margin-bottom: 8px; }
    .card p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }

    .form-group { text-align: left; margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; font-weight: bold; }
    
    input[type="text"], select {
      width: 100%; padding: 12px 14px; font-size: 15px; background: #0f172a; color: #ffffff;
      border: 1px solid #475569; border-radius: 8px; outline: none;
    }

    .btn-primary {
      width: 100%; padding: 14px; font-size: 16px; font-weight: bold; color: #fff;
      background: linear-gradient(135deg, #0284c7, #38bdf8); border: none; border-radius: 8px;
      cursor: pointer; transition: transform 0.1s;
    }
    .btn-primary:active { transform: scale(0.98); }

    /* 음악 사이트 방식 노래 목록 (카드 레이아웃) */
    .song-list { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
    .song-card {
      background: #0f172a; border: 1px solid #334155; border-radius: 12px;
      padding: 16px; display: flex; align-items: center; gap: 14px; cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .song-card.selected { border-color: #38bdf8; background: #1e293b; }
    .song-cover {
      width: 60px; height: 60px; border-radius: 8px; background: #334155;
      display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0;
    }
    .song-info { text-align: left; flex: 1; }
    .song-title { font-size: 16px; font-weight: bold; color: #f8fafc; margin-bottom: 4px; }
    .song-artist { font-size: 13px; color: #94a3b8; }
    .song-highscore { font-size: 12px; color: #38bdf8; margin-top: 4px; font-weight: bold; }

    /* 리듬게임 메인 화면 */
    #game-container {
      position: relative; width: 100%; max-width: 480px; height: 100vh;
      margin: 0 auto; background: rgba(12, 12, 24, 0.85);
      border-left: 2px solid #334155; border-right: 2px solid #334155; z-index: 2;
      display: none;
    }

    .lane {
      position: absolute; top: 0; bottom: 0; width: 25%;
      border-right: 1px dashed rgba(255,255,255,0.1);
    }

    .note {
      position: absolute; width: 23%; height: 22px;
      background: linear-gradient(180deg, #38bdf8, #0284c7);
      border-radius: 4px; box-shadow: 0 0 12px #38bdf8;
    }

    #judge-line {
      position: absolute; bottom: 120px; width: 100%; height: 6px;
      background: #f43f5e; box-shadow: 0 0 15px #f43f5e;
    }

    #touch-controls {
      position: absolute; bottom: 0; width: 100%; height: 120px; display: flex; z-index: 5;
    }
    .touch-btn {
      flex: 1; border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05); display: flex;
      align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #94a3b8;
    }
    .touch-btn:active { background: rgba(56, 189, 248, 0.35); color: #fff; }

    #in-game-ui {
      position: absolute; top: 15px; left: 15px; z-index: 10; display: flex; flex-direction: column; gap: 4px;
    }
    #user-tag { font-size: 14px; color: #94a3b8; }
    #score-board { font-size: 22px; font-weight: bold; color: #38bdf8; }
    #diff-tag { font-size: 12px; color: #f43f5e; font-weight: bold; }
  </style>
</head>
<body>

  <div id="bg-container"></div>
  <audio id="game-audio" preload="auto" crossorigin="anonymous"></audio>

  <!-- 1. 로그인 화면 -->
  <div id="login-screen" class="screen-overlay">
    <div class="card">
      <h1>⭐ StellMax</h1>
      <p>기록 저장을 위해 닉네임을 입력하세요.</p>
      <div class="form-group">
        <label for="username-input">플레이어 닉네임</label>
        <input type="text" id="username-input" placeholder="닉네임 입력">
      </div>
      <button class="btn-primary" onclick="handleLogin()">접속 및 기록 시작</button>
    </div>
  </div>

  <!-- 2. 음원 선택 및 난이도 화면 (음악 사이트 배열 방식) -->
  <div id="select-screen" class="screen-overlay" style="display: none;">
    <div class="card">
      <h1>🎵 곡 목록</h1>
      <p id="welcome-msg">플레이할 곡을 선택하세요.</p>
      
      <div class="form-group">
        <label>난이도 선택</label>
        <select id="difficulty-select" onchange="renderSongList()">
          <option value="EASY">EASY (느림)</option>
          <option value="NORMAL" selected>NORMAL (보통)</option>
          <option value="HARD">HARD (빠름)</option>
        </select>
      </div>
    </div>

    <!-- 곡 카드 목록이 들어가는 영역 -->
    <div id="song-list-container" class="song-list"></div>

    <div style="width:100%; max-width:420px; margin-top:20px;">
      <button id="start-btn" class="btn-primary" onclick="startGame()">🎮 플레이 시작</button>
    </div>
  </div>

  <!-- 3. 게임 메인 화면 -->
  <div id="game-container">
    <div id="in-game-ui">
      <div id="user-tag">PLAYER: <span id="player-name">스텔라</span></div>
      <div id="diff-tag">DIFFICULTY: <span id="diff-display">NORMAL</span></div>
      <div id="score-board">SCORE: <span id="score">0</span></div>
    </div>

    <div class="lane" style="left: 0%;"></div>
    <div class="lane" style="left: 25%;"></div>
    <div class="lane" style="left: 50%;"></div>
    <div class="lane" style="left: 75%;"></div>
    <div id="judge-line"></div>

    <div id="touch-controls">
      <div class="touch-btn" id="btn-0">D</div>
      <div class="touch-btn" id="btn-1">F</div>
      <div class="touch-btn" id="btn-2">J</div>
      <div class="touch-btn" id="btn-3">K</div>
    </div>
  </div>

  <script>
    // 🎵 곡 데이터베이스 (나중에 아래 형식대로 계속 추가하시면 됩니다!)
    const songDatabase = [
      {
        id: "song_chidori",
        title: "물떼새 (千鳥)",
        artist: "아라하시 타비",
        cover: "🦤",
        // 사파리 자동재생 및 CORS 대응 음원
        audioUrl: "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3",
        notes: [
          { lane: 0, time: 2.0 },
          { lane: 1, time: 3.5 },
          { lane: 2, time: 5.0 },
          { lane: 3, time: 6.5 },
          { lane: 0, time: 8.0 },
          { lane: 1, time: 9.5 },
          { lane: 2, time: 11.0 },
          { lane: 3, time: 12.5 },
          { lane: 0, time: 14.0 },
          { lane: 2, time: 15.5 },
          { lane: 1, time: 17.0 },
          { lane: 3, time: 18.5 },
          { lane: 0, time: 20.0 }
        ]
      }
    ];

    let username = "";
    let selectedSongIndex = 0;
    let selectedDifficulty = "NORMAL";
    let noteSpeedFactor = 350;
    let activeNotes = [], score = 0, isPlaying = false;

    const gameAudio = document.getElementById('game-audio');
    const laneKeys = ['D', 'F', 'J', 'K'];
    const laneXPercent = [1, 26, 51, 76];

    // 자동 로그인 체크 (로컬저장소)
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('stellmax_username');
      if (savedUser) {
        username = savedUser;
        showSelectScreen();
      }
    });

    function handleLogin() {
      const input = document.getElementById('username-input').value.trim();
      username = input || "스텔라";
      localStorage.setItem('stellmax_username', username);
      showSelectScreen();
    }

    function showSelectScreen() {
      document.getElementById('player-name').innerText = username;
      document.getElementById('welcome-msg').innerText = `${username}님, 플레이할 곡을 선택하세요.`;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('select-screen').style.display = 'flex';
      renderSongList();
    }

    // 노래 목록 (카드뷰) 렌더링 및 최고 점수 불러오기
    function renderSongList() {
      const container = document.getElementById('song-list-container');
      const diff = document.getElementById('difficulty-select').value;
      container.innerHTML = "";

      songDatabase.forEach((song, index) => {
        const highScoreKey = `stellmax_hs_${username}_${song.id}_${diff}`;
        const highScore = localStorage.getItem(highScoreKey) || 0;

        const card = document.createElement('div');
        card.className = `song-card ${index === selectedSongIndex ? 'selected' : ''}`;
        card.onclick = () => {
          selectedSongIndex = index;
          renderSongList();
        };

        card.innerHTML = `
          <div class="song-cover">${song.cover}</div>
          <div class="song-info">
            <div class="song-title">${song.title}</div>
            <div class="song-artist">${song.artist}</div>
            <div class="song-highscore">BEST: ${highScore} pts</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 게임 시작
    function startGame() {
      const song = songDatabase[selectedSongIndex];
      selectedDifficulty = document.getElementById('difficulty-select').value;
      document.getElementById('diff-display').innerText = selectedDifficulty;

      if (selectedDifficulty === "EASY") noteSpeedFactor = 250;
      else if (selectedDifficulty === "NORMAL") noteSpeedFactor = 350;
      else if (selectedDifficulty === "HARD") noteSpeedFactor = 500;

      document.getElementById('select-screen').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';

      // 사파리 터치 제약 해제 후 오디오 준비
      gameAudio.src = song.audioUrl;
      gameAudio.currentTime = 0;

      const playPromise = gameAudio.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          score = 0;
          document.getElementById('score').innerText = score;
          activeNotes = JSON.parse(JSON.stringify(song.notes));
          isPlaying = true;
          requestAnimationFrame(updateGame);
        }).catch(err => {
          console.error("Audio Play Error:", err);
          alert("오디오를 시작할 수 없습니다. 화면을 다시 클릭해 주세요.");
        });
      }
    }

    // 메인 오디오 루프
    function updateGame() {
      if (!isPlaying) return;

      const currentTime = gameAudio.currentTime || 0;
      const gameContainer = document.getElementById('game-container');
      document.querySelectorAll('.note').forEach(n => n.remove());

      activeNotes.forEach((note) => {
        const timeDiff = note.time - currentTime;
        if (timeDiff <= 2.0 && timeDiff >= -0.2) {
          const noteElement = document.createElement('div');
          noteElement.className = 'note';
          noteElement.style.left = laneXPercent[note.lane] + '%';
          
          const targetY = window.innerHeight - 120; 
          const currentY = targetY - (timeDiff * noteSpeedFactor); 
          
          noteElement.style.top = currentY + 'px';
          gameContainer.appendChild(noteElement);
        }
      });

      if (gameAudio.ended) {
        isPlaying = false;
        
        // 최고점수 저장
        const song = songDatabase[selectedSongIndex];
        const highScoreKey = `stellmax_hs_${username}_${song.id}_${selectedDifficulty}`;
        const currentBest = parseInt(localStorage.getItem(highScoreKey) || "0");
        
        if (score > currentBest) {
          localStorage.setItem(highScoreKey, score);
          alert(`🎉 축하합니다! 신기록 달성!\n최종 점수: ${score}점`);
        } else {
          alert(`플레이 완료!\n최종 점수: ${score}점 (최고 점수: ${currentBest}점)`);
        }

        document.getElementById('game-container').style.display = 'none';
        showSelectScreen();
      } else {
        requestAnimationFrame(updateGame);
      }
    }

    // 터치 판정
    function checkHit(laneIndex) {
      if (!isPlaying) return;
      const currentTime = gameAudio.currentTime || 0;
      const hitIndex = activeNotes.findIndex(n => n.lane === laneIndex && Math.abs(n.time - currentTime) < 0.25);

      if (hitIndex !== -1) {
        score += 100;
        document.getElementById('score').innerText = score;
        activeNotes.splice(hitIndex, 1);
      }
    }

    window.addEventListener('keydown', (e) => {
      const laneIndex = laneKeys.indexOf(e.key.toUpperCase());
      if (laneIndex !== -1) checkHit(laneIndex);
    });

    for (let i = 0; i < 4; i++) {
      const btn = document.getElementById(`btn-${i}`);
      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        checkHit(i);
      });
    }
  </script>
</body>
</html>
