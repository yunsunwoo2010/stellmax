<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>스텔라이브 리듬게임 - StellMax</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
    body { background: #0b0b12; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; user-select: none; }

    .screen-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(11, 11, 18, 0.98); z-index: 20;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; overflow-y: auto;
    }

    .card {
      background: #1e293b; border: 1px solid #334155; border-radius: 16px;
      padding: 24px; width: 100%; max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; margin-bottom: 16px;
    }

    .card h1 { color: #38bdf8; font-size: 24px; margin-bottom: 8px; }
    .card p { color: #94a3b8; font-size: 14px; margin-bottom: 16px; }

    .form-group { text-align: left; margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; font-weight: bold; }
    
    input[type="text"], select {
      width: 100%; padding: 12px; font-size: 15px; background: #0f172a; color: #ffffff;
      border: 1px solid #475569; border-radius: 8px; outline: none;
    }

    .btn-primary {
      width: 100%; padding: 14px; font-size: 16px; font-weight: bold; color: #fff;
      background: linear-gradient(135deg, #0284c7, #38bdf8); border: none; border-radius: 8px;
      cursor: pointer;
    }

    .song-list { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 10px; max-height: 40vh; overflow-y: auto; }
    .song-card {
      background: #0f172a; border: 2px solid #334155; border-radius: 12px;
      padding: 12px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer;
    }
    .song-card.selected { border-color: #38bdf8; background: #1e293b; }
    .song-cover { font-size: 24px; }
    .song-info { text-align: left; flex: 1; }
    .song-title { font-size: 15px; font-weight: bold; color: #f8fafc; }
    .song-highscore { font-size: 12px; color: #38bdf8; margin-top: 2px; }

    #game-container {
      position: relative; width: 100%; max-width: 480px; height: 100vh;
      margin: 0 auto; background: #0c0c18; display: none; z-index: 10;
    }

    .lane {
      position: absolute; top: 0; bottom: 120px; width: 25%;
      border-right: 1px dashed rgba(255,255,255,0.1);
    }

    .note {
      position: absolute; width: 22%; height: 20px;
      background: #38bdf8; border-radius: 4px; box-shadow: 0 0 10px #38bdf8;
    }

    #judge-line {
      position: absolute; bottom: 120px; width: 100%; height: 4px; background: #f43f5e;
    }

    #touch-controls {
      position: absolute; bottom: 0; width: 100%; height: 120px; display: flex; z-index: 15;
    }
    .touch-btn {
      flex: 1; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05);
      display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; color: #fff;
    }
    .touch-btn:active { background: rgba(56, 189, 248, 0.4); }

    #in-game-ui {
      position: absolute; top: 15px; left: 15px; z-index: 20; font-size: 14px; color: #94a3b8;
    }
    #score-board { font-size: 22px; font-weight: bold; color: #38bdf8; margin-top: 4px; }
  </style>
</head>
<body>

  <!-- 1. 로그인 화면 -->
  <div id="login-screen" class="screen-overlay">
    <div class="card">
      <h1>⭐ StellMax</h1>
      <p>닉네임을 입력하여 기록을 저장하세요.</p>
      <div class="form-group">
        <input type="text" id="username-input" placeholder="닉네임 입력">
      </div>
      <button class="btn-primary" onclick="handleLogin()">로그인 및 시작</button>
    </div>
  </div>

  <!-- 2. 곡 선택 화면 -->
  <div id="select-screen" class="screen-overlay" style="display: none;">
    <div class="card">
      <h1>🎵 곡 선택</h1>
      <p id="welcome-msg">환영합니다!</p>
      <div class="form-group">
        <select id="difficulty-select" onchange="renderSongList()">
          <option value="EASY">EASY</option>
          <option value="NORMAL" selected>NORMAL</option>
          <option value="HARD">HARD</option>
        </select>
      </div>
    </div>
    <div id="song-list-container" class="song-list"></div>
    <div style="width:100%; max-width:400px; margin-top:16px;">
      <button class="btn-primary" onclick="startGame()">게임 시작</button>
    </div>
  </div>

  <!-- 3. 게임 화면 -->
  <div id="game-container">
    <div id="in-game-ui">
      <div>PLAYER: <span id="player-name">스텔라</span></div>
      <div id="score-board">0</div>
    </div>

    <div class="lane" style="left: 0%;"></div>
    <div class="lane" style="left: 25%;"></div>
    <div class="lane" style="left: 50%;"></div>
    <div class="lane" style="left: 75%;"></div>
    <div id="judge-line"></div>

    <div id="touch-controls">
      <div class="touch-btn" onclick="checkHit(0)">1</div>
      <div class="touch-btn" onclick="checkHit(1)">2</div>
      <div class="touch-btn" onclick="checkHit(2)">3</div>
      <div class="touch-btn" onclick="checkHit(3)">4</div>
    </div>
  </div>

  <script>
    const songDatabase = [
      {
        id: "song_1",
        title: "물떼새 (千鳥)",
        artist: "아라하시 타비",
        cover: "🦤",
        duration: 15,
        notes: [
          { lane: 0, time: 2.0 },
          { lane: 1, time: 3.5 },
          { lane: 2, time: 5.0 },
          { lane: 3, time: 6.5 },
          { lane: 0, time: 8.0 },
          { lane: 1, time: 9.5 },
          { lane: 2, time: 11.0 },
          { lane: 3, time: 12.5 }
        ]
      }
    ];

    let username = "";
    let selectedSongIndex = 0;
    let selectedDifficulty = "NORMAL";
    let activeNotes = [], score = 0, isPlaying = false;
    let gameStartTime = 0;
    let animId = null;

    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('stellmax_user');
      if (saved) {
        username = saved;
        showSelect();
      }
    });

    function handleLogin() {
      const val = document.getElementById('username-input').value.trim();
      username = val || "플레이어";
      localStorage.setItem('stellmax_user', username);
      showSelect();
    }

    function showSelect() {
      document.getElementById('player-name').innerText = username;
      document.getElementById('welcome-msg').innerText = `${username}님, 곡을 선택하세요.`;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('select-screen').style.display = 'flex';
      renderSongList();
    }

    function renderSongList() {
      const container = document.getElementById('song-list-container');
      const diff = document.getElementById('difficulty-select').value;
      container.innerHTML = "";

      songDatabase.forEach((song, idx) => {
        const hsKey = `stellmax_hs_${username}_${song.id}_${diff}`;
        const hs = localStorage.getItem(hsKey) || 0;

        const card = document.createElement('div');
        card.className = `song-card ${idx === selectedSongIndex ? 'selected' : ''}`;
        card.onclick = () => { selectedSongIndex = idx; renderSongList(); };
        card.innerHTML = `
          <div class="song-cover">${song.cover}</div>
          <div class="song-info">
            <div class="song-title">${song.title}</div>
            <div class="song-highscore">BEST: ${hs}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function startGame() {
      const song = songDatabase[selectedSongIndex];
      selectedDifficulty = document.getElementById('difficulty-select').value;

      document.getElementById('select-screen').style.display = 'none';
      document.getElementById('game-container').style.display = 'block';

      score = 0;
      document.getElementById('score').innerText = score;
      activeNotes = JSON.parse(JSON.stringify(song.notes));
      
      gameStartTime = performance.now();
      isPlaying = true;
      if (animId) cancelAnimationFrame(animId);
      animId = requestAnimationFrame(updateGame);
    }

    function updateGame() {
      if (!isPlaying) return;

      const song = songDatabase[selectedSongIndex];
      const elapsed = (performance.now() - gameStartTime) / 1000;
      
      document.querySelectorAll('.note').forEach(n => n.remove());
      const container = document.getElementById('game-container');
      const speed = selectedDifficulty === 'HARD' ? 450 : selectedDifficulty === 'EASY' ? 250 : 350;

      activeNotes.forEach((note) => {
        const diff = note.time - elapsed;
        if (diff <= 2.5 && diff >= -0.3) {
          const el = document.createElement('div');
          el.className = 'note';
          el.style.left = (note.lane * 25 + 1.5) + '%';
          
          const targetY = window.innerHeight - 120;
          const currentY = targetY - (diff * speed);
          el.style.top = currentY + 'px';
          container.appendChild(el);
        }
      });

      if (elapsed >= song.duration) {
        endGame();
      } else {
        animId = requestAnimationFrame(updateGame);
      }
    }

    function checkHit(lane) {
      if (!isPlaying) return;
      const elapsed = (performance.now() - gameStartTime) / 1000;
      
      const idx = activeNotes.findIndex(n => n.lane === lane && Math.abs(n.time - elapsed) < 0.35);
      if (idx !== -1) {
        score += 100;
        document.getElementById('score').innerText = score;
        activeNotes.splice(idx, 1);
      }
    }

    function endGame() {
      isPlaying = false;
      if (animId) cancelAnimationFrame(animId);

      const song = songDatabase[selectedSongIndex];
      const hsKey = `stellmax_hs_${username}_${song.id}_${selectedDifficulty}`;
      const prevBest = parseInt(localStorage.getItem(hsKey) || "0");

      if (score > prevBest) {
        localStorage.setItem(hsKey, score);
        alert(`🎉 신기록! 점수: ${score}`);
      } else {
        alert(`게임 종료! 점수: ${score}`);
      }

      document.getElementById('game-container').style.display = 'none';
      showSelect();
    }
  </script>
</body>
</html>
